    <h1>杨奕护</h1>
    <h2>荔枝熟了</h2>
    <p>杨奕护是同安农民画作者。《荔枝红了甜在心里》由同安区文化馆报送，入围 2019 年全国农民画创作展。他也曾到同安区新辉小学教农民画。</p>
    <p>画里有人登梯摘果，也有人在树下把荔枝装进筐里。顺着一簇簇果实看过去，就能从树上的采摘看到树下的收成。</p>
