<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>何文亮 · 同安画家</title><link rel="stylesheet" href="tour.css?v=gallery4"><body class="artist-bio"><header><a href="index.html#artists">← 同安画家</a><a href="index.html">同安农民画集</a><label class="language-picker"><select data-language aria-label="语言"><option lang="zh-CN" value="zh-CN">简体中文</option><option lang="zh-HK" value="zh-HK">香港繁體</option><option lang="en" value="en">English</option><option lang="ja" value="ja">日本語</option></select></label></header><main><div><small>同安农民画　/　艺术家档案</small><h1>何文亮</h1><h2>从画面到课堂</h2><p>何文亮参与同安农民画创作，也曾与陈建纯、柯登科一起带领青少年写生。簸箕成了学员手上的画纸。</p><p>2020 年同安主题创作报道刊登了他的《坚定信心 科学防治》。院内挂画借用这幅作品的构图，以蓝墨重新组织明暗。</p><div class="bio-refs"><a href="https://wmf.fjsen.com/2020-02/28/content_30195324_0.htm">文明风 · 作品与作者 ↗</a><a href="https://amoy.xmnn.cn/89/">厦门网 · 写生活动 ↗</a></div></div><figure><img src="assets/work-he-wenliang.jpg" alt="作品《坚定信心 科学防治》"><figcaption>作品《坚定信心 科学防治》</figcaption></figure></main><footer><a href="index.html#visit-2">到院内看画 ↗</a><a href="artist-chen-jianchun.html">下一位 · 陈建纯 →</a></footer><script defer src="languages.js?v=1"></script><script defer src="language-switch.js?v=1"></script></body></html>
