<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陈巡 · 同安画家</title><link rel="stylesheet" href="tour.css?v=gallery4"><body class="artist-bio"><header><a href="index.html#artists">← 同安画家</a><a href="index.html">同安农民画集</a><label class="language-picker"><select data-language aria-label="语言"><option lang="zh-CN" value="zh-CN">简体中文</option><option lang="zh-HK" value="zh-HK">香港繁體</option><option lang="en" value="en">English</option><option lang="ja" value="ja">日本語</option></select></label></header><main><div><small>同安农民画　/　艺术家档案</small><h1>陈巡</h1><h2>人与人之间</h2><p>陈巡是同安农民画作者。课程选画《大岞渔女》讲海上劳动；在 2020 年发表的《抗疫情，送温暖》中，他把目光转向社区里的互助。</p><p>展棚采用《抗疫情，送温暖》的灰蓝版本。可以比较原作与单色试样，观察人物轮廓在减色以后是否依然清楚。</p><div class="bio-refs"><a href="https://wmf.fjsen.com/2020-02/28/content_30195324_0.htm">文明风 · 作品与作者 ↗</a><a href="https://www.sohu.com/a/711995109_121117481">同安农民画 · 作品资料 ↗</a></div></div><figure><img src="assets/work-chen-xun.jpg" alt="作品《抗疫情，送温暖》"><figcaption>作品《抗疫情，送温暖》</figcaption></figure></main><footer><a href="index.html#visit-2">到院内看画 ↗</a><a href="artist-he-wenliang.html">下一位 · 何文亮 →</a></footer><script defer src="languages.js?v=1"></script><script defer src="language-switch.js?v=1"></script></body></html>
