<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陈建纯 · 同安画家</title><link rel="stylesheet" href="tour.css?v=22"><body class="artist-bio"><header><a href="index.html#artists">← 同安画家</a><a href="index.html">同安农民画集</a><label class="language-picker"><select data-language aria-label="语言"><option lang="zh-CN" value="zh-CN">简体中文</option><option lang="zh-HK" value="zh-HK">香港繁體</option><option lang="en" value="en">English</option><option lang="ja" value="ja">日本語</option></select></label></header><main><div><small>同安农民画　/　艺术家档案</small><h1>陈建纯</h1><h2>海边的日常</h2><p>陈建纯从生活经验里寻找画题。捕鱼、红砖古厝和惠安女的劳作，是他反复描绘的场景。</p><p>他曾与何文亮、柯登科一起，带夏令营学员在金光湖用簸箕写生，把农民画带到日常器物上。</p><div class="bio-refs"><a href="https://amoy.xmnn.cn/89/">厦门网 · 厦门人的一天 ↗</a><a href="https://www2.xinhuanet.com/shuhua/20240710/9da94b053e914bcc8d46c2a043bf3096/c.html">新华社 · 创作现场 ↗</a></div></div><figure><img src="assets/real-tongan-1.jpg" alt="画家工作现场"><figcaption>画家工作现场</figcaption></figure></main><footer><a href="index.html#visit-2">到院内看画 ↗</a><a href="artist-chen-xun.html">下一位 · 陈巡 →</a></footer><script defer src="languages.js?v=1"></script><script defer src="language-switch.js?v=1"></script></body></html>
